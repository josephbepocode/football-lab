name: Refresh results
on:
  schedule:
    - cron: '*/30 10-23 * * 5,6,0,1'   # match days (Fri-Mon) every 30 min, 10:00-23:59 UTC
    - cron: '7 * * * 2,3,4'            # midweek hourly (catches midweek rounds)
    - cron: '7 0-9 * * 5,6,0,1'        # match-day nights hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: openfootball base (all leagues)
        run: python3 scripts/build_results.py
      - name: La Liga near-live overlay (ESPN keyless; football-data.org if secret set)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/build_live.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results data/live
          git diff --cached --quiet || (git commit -m "Refresh La Liga data (openfootball + ESPN)" && git pull --rebase && git push)
