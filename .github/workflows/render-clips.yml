name: Render clips
on: workflow_dispatch
permissions: { contents: read }
jobs:
  render:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: video } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: video/package-lock.json }
      - run: npm ci
      - run: bash scripts/render.sh out
      - uses: actions/upload-artifact@v4
        with: { name: football-lab-clips, path: video/out/*.mp4, retention-days: 14 }
